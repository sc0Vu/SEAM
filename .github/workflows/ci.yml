# Lint + tests on every push and pull request. No model calls and no credentials:
# the engine is tested with scripted workers/reviewers (CLAUDE.md, Conventions).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      # Docker is available on the runner, so the container behavior tests run too
      # (they use python:3.13-slim); the proxy isolation test needs the SEAM image
      # and is covered by the sandbox job.
      - run: pytest -q

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - name: Build the sandbox image
        run: seam image build
      - name: Sandbox and credential-proxy isolation tests (real containers)
        run: pytest -q -rs tests/test_sandbox.py tests/test_proxy.py

  # The package as users get it: build, check the metadata, install the wheel into
  # a clean venv and run the suite against that install with the source tree moved
  # away, so a file missing from the wheel fails here rather than for users.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl pytest
          /tmp/wheel-venv/bin/seam --help > /dev/null
          /tmp/wheel-venv/bin/seam-mcp --help > /dev/null
      - name: Test the installed wheel, not the checkout
        run: |
          mv seam_merge /tmp/seam_merge-src
          PATH=/tmp/wheel-venv/bin:$PATH /tmp/wheel-venv/bin/python -m pytest -q
